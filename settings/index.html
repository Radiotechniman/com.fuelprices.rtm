<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    .field { margin-bottom: 1em; }
    label { display: block; margin-bottom: .25em; font-weight: bold; }
    input { width: 8em; box-sizing: border-box; font-size: 1em; padding: .5em; }
    .hint { color: #888; font-size: .9em; margin-top: .25em; }
    table { width: 100%; border-collapse: collapse; font-size: .9em; }
    th, td { text-align: left; padding: .3em .5em; border-bottom: 1px solid rgba(128, 128, 128, .3); }
    .err { color: #d33; }
    #saved { margin-left: 1em; color: #1B7F5C; }
    h2 { margin-top: 1.5em; }
  </style>
</head>
<body>
  <h2 data-i18n="settings.refresh"></h2>
  <div class="field">
    <label for="interval" data-i18n="settings.default_interval"></label>
    <input id="interval" type="number" min="5" max="1440" step="1">
    <button id="save" class="hy-button-primary" data-i18n="settings.save"></button>
    <span id="saved"></span>
    <div class="hint" data-i18n="settings.interval_hint"></div>
  </div>
  <table id="devices"></table>

  <h2 data-i18n="settings.log"></h2>
  <div id="summary" class="hint"></div>
  <table id="log"></table>
  <p><button id="clear" data-i18n="settings.clear"></button></p>

  <script type="application/javascript">
    function onHomeyReady(Homey) {
      var t = function (k) { return Homey.__(k); };
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      var cell = function (text, cls) {
        var td = document.createElement('td');
        td.textContent = text;
        if (cls) td.className = cls;
        return td;
      };
      var fill = function (table, head, rows) {
        table.innerHTML = '';
        var tr = document.createElement('tr');
        head.forEach(function (h) { var th = document.createElement('th'); th.textContent = h; tr.appendChild(th); });
        table.appendChild(tr);
        rows.forEach(function (r) { table.appendChild(r); });
      };
      var row = function (cells, cls) {
        var tr = document.createElement('tr');
        cells.forEach(function (c) { tr.appendChild(cell(c, cls)); });
        return tr;
      };
      var stamp = function (ms) {
        return new Date(ms).toLocaleString(undefined, { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
      };

      function renderLog(log) {
        log = log || [];
        var failed = log.filter(function (e) { return !e.ok; }).length;
        var lastOk = log.filter(function (e) { return e.ok; }).pop();
        document.getElementById('summary').textContent =
          t('settings.last_ok') + ': ' + (lastOk ? stamp(lastOk.t) : '-') + ' · ' +
          t('settings.errors') + ': ' + failed + '/' + log.length;
        fill(document.getElementById('log'),
          [t('settings.time'), t('settings.device'), t('settings.result'), t('settings.duration'), t('settings.info')],
          log.slice().reverse().map(function (e) {
            return row([stamp(e.t), e.device, e.ok ? 'OK' : t('settings.error'), (e.ms / 1000).toFixed(1) + ' s', e.detail || ''], e.ok ? '' : 'err');
          }));
      }

      function renderStatus() {
        Homey.api('GET', '/status', null, function (err, status) {
          if (err) return;
          document.getElementById('interval').value = status.defaultInterval;
          fill(document.getElementById('devices'), [t('settings.device'), t('settings.interval')],
            status.devices.map(function (d) {
              var text = d.intervalMinutes == null ? t('settings.manual')
                : d.intervalMinutes + ' min' + (d.custom ? ' (' + t('settings.own') + ')' : '');
              return row([d.name, text]);
            }));
          renderLog(status.log);
        });
      }

      document.getElementById('save').addEventListener('click', function () {
        var value = parseInt(document.getElementById('interval').value, 10);
        var saved = document.getElementById('saved');
        if (!(value >= 5 && value <= 1440)) { saved.textContent = t('settings.invalid'); saved.className = 'err'; return; }
        Homey.set('defaultInterval', value, function (err) {
          saved.className = err ? 'err' : '';
          saved.textContent = err ? err.message : t('settings.saved');
          setTimeout(renderStatus, 500);
        });
      });
      document.getElementById('clear').addEventListener('click', function () {
        Homey.api('DELETE', '/log', null, renderStatus);
      });

      renderStatus();
      Homey.ready();
    }
  </script>
</body>
</html>
